[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartcli"
version = "0.1.0"
description = "个人智能命令行助手"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
smartcli = "smartcli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
